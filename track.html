<body data-page="track">
<main>
<section class="wrap page-head">
  <p class="eyebrow">Track your order</p>
  <h1>Where is my order?</h1>
  <p class="lead">Enter your order number and the phone number you ordered with. Rashida posts updates here as soon as she has checked your items.</p>
</section>
<section class="wrap">
  <div class="track-grid">
    <form class="panel" id="trackForm" novalidate>
      <label class="field">Order number<input name="ref" required placeholder="e.g. TN-1004" autocapitalize="characters" autocomplete="off"></label>
      <label class="field">Phone number<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="The number you ordered with"></label>
      <p class="err" id="trackErr" role="alert" hidden></p>
      <button class="btn primary wide" id="trackBtn" type="submit">Track order</button>
      <div id="trackSaved" hidden></div>
    </form>
    <div id="trackResult" hidden></div>
  </div>
</section>
</main>
<script src="config.js"></script>
<script src="sb.js"></script>
<script src="app.js"></script>
