<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Track Your Order | TheNobles.gift&surprise_hub</title>
<meta name="description" content="Follow your TheNobles order: availability, preparation and delivery updates from Rashida.">
<meta name="theme-color" content="#c2334f">
<meta property="og:title" content="Track Your Order | TheNobles">
<meta property="og:description" content="Follow your TheNobles order.">
<meta property="og:image" content="img/p16.jpg">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="track">
<main>
<section class="wrap page-head">
  <p class="eyebrow">Track your order</p>
  <h1>Where is my order?</h1>
  <p class="lead">Enter your order number and the phone number you ordered with. Rashida posts updates here as soon as she has checked your items.</p>
</section>
<section class="wrap">
  <div class="track-grid">
    <form class="panel" id="trackForm" novalidate>
      <label class="field">Order number<input name="ref" required placeholder="e.g. TN-1004" autocapitalize="characters" autocomplete="off"></label>
      <label class="field">Phone number<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="The number you ordered with"></label>
      <p class="err" id="trackErr" role="alert" hidden></p>
      <button class="btn primary wide" id="trackBtn" type="submit">Track order</button>
      <div id="trackSaved" hidden></div>
    </form>
    <div id="trackResult" hidden></div>
  </div>
</section>
</main>
<script src="config.js"></script>
<script src="sb.js"></script>
<script src="app.js"></script>
</body>
</html>
