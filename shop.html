<head>

<body data-page="shop">
<main>
<section class="wrap page-head">
  <p class="eyebrow">Shop</p>
  <h1 id="shopTitle">The collection</h1>
  <p class="lead">Tap any gift to add a name or message, then send your order on WhatsApp.</p>
</section>
<section class="wrap shop">
  <div class="search">
    <input id="q" type="search" placeholder="Search flowers, gifts, boxes" aria-label="Search products">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
  <div class="chips" id="chips" role="tablist"></div>
  <p class="count" id="resultCount"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No gifts match that search. Message us on WhatsApp for a custom order.</p>
</section>
</main>
<script src="config.js"></script>
<script src="sb.js"></script>
<script src="app.js"></script>
